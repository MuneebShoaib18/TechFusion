
apiVersion: apps/v1
kind: Deployment
metadata:
  name: techfusion-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: techfusion
  template:
    metadata:
      labels:
        app: techfusion
    spec:
      containers:
        - name: techfusion
          image: techfusion:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
